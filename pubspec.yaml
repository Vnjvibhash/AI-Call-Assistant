name: aicallassistant
description: "AI Call Assistant - Personal AI Phone Assistant with Real-Time Transcription, Hindi & English Support, and Smart Call Management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0

  # Database & Local Storage
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # AI & Cloud Services
  google_generative_ai: ^0.4.3
  http: ^1.2.2

  # Speech & Audio
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Device, Telephony & Permissions
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  # Export Document (PDF/Text)
  pdf: ^3.11.1
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
